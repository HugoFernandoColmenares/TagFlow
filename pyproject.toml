[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagflow"
version = "1.1.0"
description = "Aplicación local para organizar, etiquetar y depurar imágenes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HugoFernandoColmenares" }]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
tagflow = "tagflow.main:main"

[tool.setuptools.packages.find]
include = ["tagflow*"]

[tool.setuptools.package-data]
tagflow = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
